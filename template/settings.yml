  category: "discovery,life"
- keyname: follow
  field_type: select
  name: Animals
  description: Tick one species to follow it, or several to show them in turn. Leave all unticked to show every species in turn.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  optional: true
  multiple: true
  options:
  - White Stork
  - Common Crane
  - European Honey Buzzard
  - European Turtle Dove
  - Lesser Black-backed Gull
  - Red-backed Shrike
  - Northern Wheatear
  - Far Eastern Curlew
  - Broad-winged Hawk
  - Turkey Vulture
  - Osprey
  - Snow Goose
  - Canada Goose
  - Bald Eagle
  - Blackpoll Warbler
  - Blue Whale
  - Loggerhead Turtle
  - Peregrine Falcon
- keyname: show_photo
  field_type: boolean
  name: Species photo
  description: Show a photo of the species beside the text.
  optional: true
  default: true
- keyname: units
  field_type: select
  name: Units
  description: Distances and measurements in kilometres or miles.
  default: metric
  options:
  - Metric
  - Imperial
- keyname: language
  field_type: select
  name: Language
  default: English
  options:
  - English
  - Deutsch
