    Common Crane: Elena Ilyashenko, <a href="https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study542653863">1000 Cranes. Russia. Common Crane.</a>, CC BY<br>
    European Honey Buzzard: Dr. Daniel Schmidt-Rothmund, <a href="https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study186178781">Raptors NABU Moessingen public</a>, CC BY<br>
    European Honey Buzzard: Thomas Alerstam, <a href="https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study49904341">European Honey-Buzzard, Southern Sweden</a>, CC0<br>
    European Turtle Dove: Frédéric Jiguet, <a href="https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study3413045568">Habitrack European Turtle Dove</a>, CC BY<br>
