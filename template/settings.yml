# TRMNL recipe settings (decisions F1, V1). Keynames must not match payload
# keys (state, kind, species, name, status, where, fact, credit, toward, geo):
# Map of the Day found that a setting and a feed key of the same name collide.
# Select values reach the Worker snake_cased from the label (Nextbike). The species
# field is a multi select (owner, 2026-09-29); how TRMNL passes several ticks is not
# documented, so the polling URL joins them and the Worker accepts any separator.
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: |
    Follow migrating animals on a map: white storks, cranes, honey buzzards, turtle doves, gulls, shrikes, wheatears, curlews, hawks, vultures, ospreys, snow geese, Canada geese, bald eagles, blackpoll warblers, peregrine falcons, a blue whale and a loggerhead turtle. Animals with a working GPS tag show their last position and its date. The others show where they usually are on this day, from a full year of their own published tracking data. A thick line shows where the journey began, a thin line where it usually goes next.<br><br>
    Tracking data: Movebank and the Movebank Data Repository (CC0 and CC BY studies only). Map places: Natural Earth.<br><br>
    Species photos, cropped and converted to greyscale for e-ink (modified from the originals). Licensed <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, without warranties:<br>
    White Stork: (c) SteveM4560, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/202678318">iNaturalist</a><br>
    Common Crane: (c) Parth Kansara, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/141518478">iNaturalist</a><br>
    European Honey Buzzard: (c) Настя Бухвалова, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/176780483">iNaturalist</a><br>
    European Turtle Dove: (c) Mourad Harzallah, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/79680063">iNaturalist</a><br>
    Red-backed Shrike: (c) SteveM4560, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/161059968">iNaturalist</a><br>
    Northern Wheatear: (c) Jan Ebr &amp; Ivana Ebrová, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/217335629">iNaturalist</a><br>
    Far Eastern Curlew: (c) Tim, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/104576393">iNaturalist</a><br>
    Broad-winged Hawk: (c) Abby Darrah, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/109546486">iNaturalist</a><br>
    Loggerhead Turtle: (c) Annika Lindqvist, some rights reserved (CC BY), <a href="https://www.inaturalist.org/observations/1293229">iNaturalist</a><br>
    Public domain (<a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>): <a href="https://www.inaturalist.org/observations/237391671">Lesser Black-backed Gull</a>, <a href="https://www.inaturalist.org/observations/247699630">Turkey Vulture</a>, <a href="https://www.inaturalist.org/observations/155430378">Blue Whale</a>.
  category: "discovery,life"
- keyname: follow
  field_type: select
  name: Animals
  description: Tick one species to follow it, or several to show them in turn. Leave all unticked to show every species in turn.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  optional: true
  multiple: true
  options:
  - White Stork
  - Common Crane
  - European Honey Buzzard
  - European Turtle Dove
  - Lesser Black-backed Gull
  - Red-backed Shrike
  - Northern Wheatear
  - Far Eastern Curlew
  - Broad-winged Hawk
  - Turkey Vulture
  - Osprey
  - Snow Goose
  - Canada Goose
  - Bald Eagle
  - Blackpoll Warbler
  - Blue Whale
  - Loggerhead Turtle
  - Peregrine Falcon
- keyname: show_photo
  field_type: boolean
  name: Species photo
  description: Show a photo of the species beside the text.
  optional: true
  default: true
- keyname: language
  field_type: select
  name: Language
  default: English
  options:
  - English
  - Deutsch
