    Broad-winged Hawk: Laurie Goodrich, <a href="https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study28691134">Broad-winged Hawk habitat use, range, and movement ecology</a>, CC BY<br>
    Turkey Vulture: David Barber, <a href="https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study481458">Vultures Acopian Center USA GPS</a>, CC BY<br>
