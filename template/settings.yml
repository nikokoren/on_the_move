    Northern Wheatear: Movebank Data Repository, <a href="https://doi.org/10.5441/001/1.tn4h3kt0">Data from: Locally adapted migration strategies: Comparing routes and timing of northern wheatears from alpine and lowland European populations [Austria]</a>, CC0<br>
